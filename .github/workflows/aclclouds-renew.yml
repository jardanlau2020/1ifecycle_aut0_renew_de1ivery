name: ACLClouds Auto Renew
on:
  schedule:
    - cron: '0 */12 * * *'  # 每 12 小时
  workflow_dispatch:
jobs:
  renew:
    name: 续期检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: 运行续期脚本
        env:
          ACLCLOUDS_SESSION_COOKIE: ${{ secrets.ACLCLOUDS_SESSION_COOKIE }}
          ACLCLOUDS_SERVER_ID: ${{ secrets.ACLCLOUDS_SERVER_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python3 scripts/aclclouds_renew.py

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aclclouds-debug
          path: /tmp/aclclouds-debug.png
          retention-days: 3