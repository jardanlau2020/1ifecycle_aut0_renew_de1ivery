name: Wasmer Health Check
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Wasmer health
        env:
          WASMER_HEALTH_URL: https://wx-node-test.wasmer.app/health
        run: |
          set -e
          curl --fail --silent --show-error --max-time 25 "$WASMER_HEALTH_URL"
          echo
          echo 'Wasmer health check passed'
