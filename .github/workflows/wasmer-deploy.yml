name: Wasmer Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wasmer_app/**'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Wasmer CLI
        run: curl -fsSL https://get.wasmer.io -o /tmp/wasmer-install.sh && sh /tmp/wasmer-install.sh
      - name: Deploy app
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          set -e
          test -n "$WASMER_TOKEN"
          /root/.wasmer/bin/wasmer app deploy --dir wasmer_app --non-interactive --no-wait --build-remote --token "$WASMER_TOKEN"
      - name: Verify health
        run: curl --fail --silent --show-error --max-time 30 https://wx-node-test.wasmer.app/health
