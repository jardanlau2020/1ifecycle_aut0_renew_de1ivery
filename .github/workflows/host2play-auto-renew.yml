name: Host2Play Auto-Renew

on:
  schedule:
    # 每 4 小时检查一次（北京时间 0/4/8/12/16/20）
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force renewal even if not near expiry'
        required: false
        default: 'false'

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install seleniumbase aiohttp

      - name: Run Host2Play renewal
        env:
          H2P_USERNAME: ${{ secrets.H2P_USERNAME }}
          H2P_PASSWORD: ${{ secrets.H2P_PASSWORD }}
          H2P_SERVER_ID: ${{ secrets.H2P_SERVER_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 scripts/host2play_renew.py