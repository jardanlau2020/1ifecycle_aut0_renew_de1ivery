name: Platform Health Check
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check Wasmer health
        run: |
          set -e
          curl --fail --silent --show-error --max-time 25 "https://wx-node-test.wasmer.app/health"
          echo ''
          echo '✅ Wasmer health check passed'
