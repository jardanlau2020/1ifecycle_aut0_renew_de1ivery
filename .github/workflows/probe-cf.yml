name: CF Probe (diagnostic)

# 2026-09-20 加：一次性診斷 workflow，唔跟排程、唔係保活。
# 目的：乾淨瀏覽器（唔做任何頁面改動、只撳一次）分別用 playwright / patchright
# 開 hub.weirdhost.xyz，睇 cf_clearance 會唔會落地 —— 分清
# 「我哋自動化太粗暴」vs「GHA runner IP 信譽太低」。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "要探嘅 URL"
        required: false
        default: "https://hub.weirdhost.xyz/"
      engines:
        description: "引擎（逗號分隔）"
        required: false
        default: "playwright,patchright"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安裝系統依賴
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils fonts-nanum fonts-noto-cjk >/dev/null

      - name: 安裝 python 依賴 + 兩個引擎嘅 Chromium
        run: |
          pip install --quiet playwright patchright
          python -m playwright install --with-deps chromium
          python -m patchright install chromium || echo "patchright chromium 安裝失敗（ARM 會自己報錯）"
          # camoufox（反偵測 Firefox）：專門補 WebGL/音頻/字體指紋，Chromium 兩隻引擎都過唔到時用
          pip install --quiet "camoufox[geoip]" || echo "[WARN] camoufox 裝唔到"
          python -m camoufox fetch || echo "[WARN] camoufox 瀏覽器下載失敗"

      - name: 起代理（有 NODE_LINK 先起，失敗就直連）
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          python3 scripts/proxy_up.py 2>&1 | tee -a probe.log
          # proxy_up.py 會寫 PROBE_PROXY 落 GITHUB_ENV

      - name: 顯示出口 IP 對照（直連 vs 代理）
        continue-on-error: true
        run: |
          echo "--- 直連 ---"
          curl -s -m 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^ip=|^loc=" || true
          echo "--- 代理（PROBE_PROXY=$PROBE_PROXY）---"
          if [ -n "$PROBE_PROXY" ]; then
            curl -s -m 25 --socks5-hostname "${PROBE_PROXY#socks5://}" \
              https://www.cloudflare.com/cdn-cgi/trace | grep -E "^ip=|^loc=" || true
          else
            echo "（冇代理）"
          fi

      - name: 跑探針
        env:
          PROBE_URL: ${{ github.event.inputs.url }}
          PROBE_ENGINES: ${{ github.event.inputs.engines }}
          PROBE_WAIT: "70"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python scripts/probe_cf.py 2>&1 | tee probe.log
        continue-on-error: true

      - name: 上傳截圖 + 結果
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cf-probe
          path: |
            probe_*.png
            probe.log
            probe_result.json
          retention-days: 7
