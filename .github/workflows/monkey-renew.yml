name: MonkeyBytes Auto Renew

on:
  schedule:
    # 每日 10:00 UTC = 18:00 香港時間（15 日週期 + 7 日窗口，每日檢查綽綽有餘）
    # ⚠️ 2026-09-25 現況：MonkeyBytes 帳號下 0 台伺服器（舊曼谷機 2533c753 早被平台刪），
    #    lifecycle API 回 404。腳本已改成「0 台 → 出提示 + exit 0」，唔再標紅。
    #    要恢復：開新機 → 更新 secret MONKEY_SERVER_IDENTIFIER。
    - cron: "0 10 * * *"
  workflow_dispatch: # 喺 Actions 分頁可以手動觸發

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run renewal script
        env:
          MONKEY_API_KEY: ${{ secrets.MONKEY_API_KEY }}
          # 2026-09-23 修：原本写死 "2533c753"（旧曼谷机）——该 ID 已被平台删掉，
          # 09-18~09-22 连续 5 单 404。改读 secret，换机只需更新 secret，不用改代码。
          SERVER_ID: ${{ secrets.MONKEY_SERVER_IDENTIFIER }}
        run: bash scripts/check_and_renew.sh