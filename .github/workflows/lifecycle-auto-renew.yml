name: Lifecycle Auto Renew
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check and confirm lifecycle
        env:
          MONKEY_API_KEY: ${{ secrets.MONKEY_API_KEY }}
          MONKEY_SERVER_IDENTIFIER: ${{ secrets.MONKEY_SERVER_IDENTIFIER }}
          ACLCLOUDS_HEALTH_URL: ${{ secrets.ACLCLOUDS_HEALTH_URL }}
        run: python3 lifecycle_auto_renew.py
